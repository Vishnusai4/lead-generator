version: '3.8'

services:
  api:
    build: .
    container_name: zendesk-lead-generator
    ports:
      - "8000:8000"
    environment:
      - CLEARBIT_API_KEY=${CLEARBIT_API_KEY}
      - LOG_LEVEL=INFO
      - API_PORT=8000
    volumes:
      # Persist database and CSV files
      - ./data:/data
      - ./logs:/logs
      # Mount config
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
